<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fairway Club — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080e09;--s1:#0d1810;--s2:#122016;--s3:#1a2d1e;
  --gold:#c9a84c;--gold-l:#dfc06a;--gold-dim:rgba(201,168,76,.12);
  --cream:#ede2c8;--text:#d4cbb4;--muted:#6b8572;--dim:#3c5243;
  --border:rgba(201,168,76,.18);--border-s:rgba(201,168,76,.38);
  --red:#c95a3a;--green:#52a86e;--r:4px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
html,body{min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:'Lora',Georgia,serif;font-size:15px;line-height:1.6;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(30,70,35,.22) 0%,transparent 55%),radial-gradient(ellipse at 80% 100%,rgba(15,45,20,.2) 0%,transparent 55%);}
.app{max-width:900px;margin:0 auto;padding:0 24px 80px}
.hdr{text-align:center;padding:52px 0 32px;border-bottom:1px solid var(--border);margin-bottom:40px;position:relative}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(32px,6vw,54px);font-weight:700;color:var(--cream);letter-spacing:.02em;line-height:1.1}
.title em{color:var(--gold);font-style:italic}
.subtitle{font-size:13px;color:var(--muted);margin-top:8px;font-style:italic;letter-spacing:.04em}
.user-bar{position:absolute;top:52px;right:0;display:flex;align-items:center;gap:10px}
.user-name{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.1em}
.btn-sm{background:transparent;border:.5px solid var(--border);border-radius:var(--r);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;cursor:pointer;transition:all .18s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.nav{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:40px}
.nbtn{flex:1;background:transparent;border:none;border-right:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:12px 8px;cursor:pointer;transition:all .18s}
.nbtn:last-child{border-right:none}
.nbtn:hover{background:var(--gold-dim);color:var(--gold-l)}
.nbtn.on{background:var(--gold-dim);color:var(--gold);font-weight:500}
.slbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:12px}
.slbl::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-wrap{max-width:400px;margin:40px auto 0}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:28px}
.atab{flex:1;background:transparent;border:none;border-right:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px;cursor:pointer;transition:all .18s}
.atab:last-child{border-right:none}
.atab.on{background:var(--gold-dim);color:var(--gold)}
.auth-title{font-family:'Playfair Display',serif;font-size:26px;color:var(--cream);margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:24px}
.fg{margin-bottom:16px}
.fg label{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);color:var(--cream);font-family:'Lora',serif;font-size:15px;padding:10px 14px;outline:none;transition:border-color .18s;-webkit-appearance:none;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg input::placeholder{color:var(--dim)}
.fg select option{background:#1a2d1e}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fsec{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin:24px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.btnp{width:100%;background:var(--gold);color:#080e09;border:none;border-radius:var(--r);padding:12px 24px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;cursor:pointer;margin-top:8px;transition:background .18s}
.btnp:hover{background:var(--gold-l)}
.btnp:disabled{opacity:.4;cursor:not-allowed}
.btns{background:transparent;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:6px 14px;cursor:pointer;transition:all .15s}
.btns:hover{border-color:var(--gold);color:var(--gold)}
.err{font-family:'DM Mono',monospace;font-size:12px;color:var(--red);margin-top:10px;min-height:18px}
.lbt{width:100%;border-collapse:collapse}
.lbt th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:7px 12px;text-align:left;border-bottom:1px solid var(--border)}
.lbt th.r,.lbt td.r{text-align:right}
.lbrow{border-bottom:1px solid rgba(201,168,76,.07);cursor:pointer;transition:background .15s}
.lbrow:hover{background:var(--gold-dim)}
.lbrow td{padding:14px 12px;vertical-align:middle}
.rnk{font-family:'DM Mono',monospace;font-size:13px;color:var(--dim);width:34px}
.rnk.g1{color:var(--gold);font-weight:500}
.rnk.g2{color:#8a9e8a}
.rnk.g3{color:#9a7040}
.pname{font-family:'Playfair Display',serif;font-size:19px;color:var(--cream)}
.pme{font-size:10px;font-family:'DM Mono',monospace;color:var(--gold);margin-left:7px;letter-spacing:.1em;vertical-align:middle}
.psub{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.hv{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--gold);text-align:right}
.sv{font-family:'DM Mono',monospace;font-size:13px;color:var(--text);text-align:right}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-style:italic}
.empty strong{display:block;font-size:17px;color:var(--muted);font-weight:400;margin-bottom:6px}
.bbk{background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:26px;transition:color .15s;display:flex;align-items:center;gap:6px}
.bbk:hover{color:var(--gold)}
.phero{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:34px;padding-bottom:22px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px}
.phn{font-family:'Playfair Display',serif;font-size:40px;font-weight:400;color:var(--cream);line-height:1;margin-bottom:8px}
.phhl{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.phhv{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--gold);margin-left:6px}
.rbadge{text-align:right}
.rbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-bottom:3px}
.rbv{font-family:'Playfair Display',serif;font-size:62px;color:var(--gold);line-height:1}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-bottom:34px}
.sc{background:var(--s2);border-radius:var(--r);padding:14px;text-align:center;border:1px solid var(--border)}
.scl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.scv{font-family:'DM Mono',monospace;font-size:21px;font-weight:500;color:var(--cream)}
.scv.ac{color:var(--gold)}
.rt{width:100%;border-collapse:collapse;font-size:12px}
.rt th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
.rt td{padding:9px 8px;border-bottom:1px solid rgba(201,168,76,.06);font-family:'DM Mono',monospace;color:var(--text);vertical-align:middle}
.rt tr:last-child td{border-bottom:none}
.sp{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500}
.su{background:rgba(82,168,110,.18);color:#52a86e}
.so{background:rgba(201,90,58,.15);color:#c95a3a}
.se{background:rgba(201,168,76,.15);color:var(--gold)}
.db{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 3px;transition:color .15s}
.db:hover{color:var(--red)}
.he{display:flex;align-items:center;gap:8px;margin-top:8px}
.he input{width:90px}
.fw{max-width:560px;margin:0 auto}
.ft{font-family:'Playfair Display',serif;font-size:28px;color:var(--cream);margin-bottom:6px}
.fs{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:28px}
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--border-s);border-radius:var(--r);padding:10px 20px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--cream);box-shadow:var(--shadow);z-index:99;animation:fuUp .22s ease;white-space:nowrap}
@keyframes fuUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ld{text-align:center;padding:70px;color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.1em}
@media(max-width:580px){.g2,.g3{grid-template-columns:1fr}.phn{font-size:28px}.rbv{font-size:44px}.user-bar{position:static;justify-content:center;margin-top:14px}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="eyebrow">Summer 2026</div>
    <h1 class="title">The <em>Fairway</em> Club</h1>
    <p class="subtitle">Friends. Fairways. Bragging rights.</p>
    <div class="user-bar" id="user-bar" style="display:none">
      <span class="user-name" id="user-name-label"></span>
      <button class="btn-sm" id="logout-btn">Sign Out</button>
    </div>
  </header>
  <nav class="nav" id="nav" style="display:none">
    <button class="nbtn on" data-v="lb">Leaderboard</button>
    <button class="nbtn" data-v="log">Log Round</button>
  </nav>
  <main id="main"><div class="ld">Loading the club…</div></main>
</div>
<script>
let players = [], me = null, view = 'auth', selId = null, authTab = 'login', nT = null;
const $ = id => document.getElementById(id);
const main = () => $('main');
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}
function saveSession() { if (me) localStorage.setItem('fc_session', JSON.stringify({id:me.id,name:me.name,password:me._pw})); }
function clearSession() { localStorage.removeItem('fc_session'); }
function getSession() { try { return JSON.parse(localStorage.getItem('fc_session')); } catch { return null; } }
function notify(msg) {
  document.querySelectorAll('.notif').forEach(n=>n.remove());
  if (nT) clearTimeout(nT);
  const el = document.createElement('div'); el.className='notif'; el.textContent=msg;
  document.body.appendChild(el); nT = setTimeout(()=>el.remove(), 3200);
}
function sorted() { return [...players].sort((a,b)=>a.hcp-b.hcp); }
function pstats(rounds) {
  const scores = (rounds||[]).map(r=>r.score).filter(v=>v!=null);
  return {
    avs: avg(scores), best: scores.length?Math.min(...scores):null,
    aputts: avg((rounds||[]).filter(r=>r.putts!=null).map(r=>r.putts)),
    adrive: avg((rounds||[]).filter(r=>r.drive!=null).map(r=>r.drive)),
    agir: avg((rounds||[]).filter(r=>r.gir!=null).map(r=>r.gir)),
    afir: avg((rounds||[]).filter(r=>r.fir!=null).map(r=>(r.fir/(r.firT||14))*100)),
    n: (rounds||[]).length
  };
}
function go(v, id) {
  view=v; selId=id||null;
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  render();
}
$('nav').addEventListener('click', e=>{ const b=e.target.closest('.nbtn'); if(b) go(b.dataset.v); });
$('logout-btn').addEventListener('click', ()=>{ me=null; clearSession(); $('nav').style.display='none'; $('user-bar').style.display='none'; go('auth'); });
function render() {
  const m=main();
  if(view==='auth') rAuth(m);
  else if(view==='lb') rLB(m);
  else if(view==='log') rLog(m);
  else if(view==='det') rDet(m);
}
function rAuth(el) {
  el.innerHTML=`<div class="auth-wrap">
    <div class="auth-tabs">
      <button class="atab ${authTab==='login'?'on':''}" id="tab-login">Sign In</button>
      <button class="atab ${authTab==='register'?'on':''}" id="tab-register">Create Account</button>
    </div>
    ${authTab==='login'?`
      <div class="auth-title">Welcome back.</div>
      <div class="auth-sub">Sign in to log rounds and track your season.</div>
      <div class="fg"><label>Your Name</label><input id="l-name" type="text" placeholder="e.g. Tiger Woods" /></div>
      <div class="fg"><label>Password</label><input id="l-pw" type="password" placeholder="••••••••" /></div>
      <div class="err" id="auth-err"></div>
      <button class="btnp" id="auth-submit">Sign In</button>
    `:`
      <div class="auth-title">Join the club.</div>
      <div class="auth-sub">Create your account to join the leaderboard.</div>
      <div class="fg"><label>Your Name</label><input id="r-name" type="text" placeholder="e.g. Tiger Woods" /></div>
      <div class="fg"><label>Handicap Index</label><input id="r-hcp" type="number" step="0.1" min="-10" max="54" placeholder="e.g. 12.4" /></div>
      <div class="fg"><label>Password</label><input id="r-pw" type="password" placeholder="Choose a password" /></div>
      <div class="err" id="auth-err"></div>
      <button class="btnp" id="auth-submit">Create Account</button>
    `}
  </div>`;
  el.querySelector('#tab-login').addEventListener('click',()=>{authTab='login';rAuth(el);});
  el.querySelector('#tab-register').addEventListener('click',()=>{authTab='register';rAuth(el);});
  el.querySelector('#auth-submit').addEventListener('click', async()=>{
    const errEl=el.querySelector('#auth-err'); errEl.textContent='';
    const btn=el.querySelector('#auth-submit'); btn.disabled=true;
    try {
      let player;
      if(authTab==='login'){
        const name=el.querySelector('#l-name').value.trim(), pw=el.querySelector('#l-pw').value;
        if(!name||!pw) throw new Error('Please fill in all fields.');
        player=await api('POST','/api/login',{name,password:pw}); player._pw=pw;
      } else {
        const name=el.querySelector('#r-name').value.trim(), hcp=parseFloat(el.querySelector('#r-hcp').value), pw=el.querySelector('#r-pw').value;
        if(!name||isNaN(hcp)||!pw) throw new Error('Please fill in all fields.');
        if(pw.length<4) throw new Error('Password must be at least 4 characters.');
        player=await api('POST','/api/players',{name,hcp,password:pw}); player._pw=pw;
      }
      me=player; saveSession();
      players=await api('GET','/api/players');
      const myFull=players.find(p=>p.id===me.id);
      if(myFull) me={...me,rounds:myFull.rounds};
      showApp();
    } catch(e){ errEl.textContent=e.message; btn.disabled=false; }
  });
  el.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter') el.querySelector('#auth-submit').click(); }));
}
function showApp() {
  $('user-name-label').textContent=me.name;
  $('user-bar').style.display='flex';
  $('nav').style.display='flex';
  go('lb');
}
function rLB(el) {
  const ps=sorted();
  if(!ps.length){ el.innerHTML=`<div class="slbl">Standings</div><div class="empty"><strong>The course is empty.</strong>Be the first to create an account!</div>`; return; }
  const rows=ps.map((p,i)=>{
    const s=pstats(p.rounds); const rc=i===0?'g1':i===1?'g2':i===2?'g3':''; const n=p.rounds?.length||0; const isMe=me&&p.id===me.id;
    return`<tr class="lbrow" data-id="${p.id}"><td><span class="rnk ${rc}">${i+1}</span></td><td><div class="pname">${esc(p.name)}${isMe?'<span class="pme">You</span>':''}</div>${n?`<div class="psub">${n} round${n!==1?'s':''} played</div>`:''}</td><td class="hv r">${p.hcp}</td><td class="sv r">${s.n||'—'}</td><td class="sv r">${s.avs!=null?s.avs.toFixed(1):'—'}</td><td class="sv r">${s.best!=null?s.best:'—'}</td></tr>`;
  }).join('');
  el.innerHTML=`<div class="slbl">Standings</div><table class="lbt"><thead><tr><th></th><th>Player</th><th class="r">HCP</th><th class="r">Rounds</th><th class="r">Avg Score</th><th class="r">Best</th></tr></thead><tbody>${rows}</tbody></table>`;
  el.querySelectorAll('.lbrow').forEach(r=>r.addEventListener('click',()=>go('det',r.dataset.id)));
}
function rLog(el) {
  const today=new Date().toISOString().split('T')[0];
  el.innerHTML=`<div class="fw">
    <div class="ft">Log a Round</div>
    <div class="fs">Logging as <strong style="color:var(--gold);font-style:normal">${esc(me.name)}</strong>.</div>
    <div class="g2">
      <div class="fg"><label>Date</label><input id="ld" type="date" value="${today}" /></div>
      <div class="fg"><label>Course Name</label><input id="lc" type="text" placeholder="Augusta National…" /></div>
    </div>
    <div class="fsec">Score</div>
    <div class="g2">
      <div class="fg"><label>Gross Score</label><input id="lsc" type="number" min="50" max="200" placeholder="e.g. 84" /></div>
      <div class="fg"><label>Course Par</label><input id="lpar" type="number" value="72" min="60" max="80" /></div>
    </div>
    <div class="fsec">On-Course Stats</div>
    <div class="g3">
      <div class="fg"><label>Fairways Hit</label><input id="lfir" type="number" min="0" max="18" placeholder="e.g. 9" /></div>
      <div class="fg"><label>Of (Total FWs)</label><input id="lfirt" type="number" value="14" min="1" max="18" /></div>
      <div class="fg"><label>GIR (of 18)</label><input id="lgir" type="number" min="0" max="18" placeholder="e.g. 7" /></div>
    </div>
    <div class="g3">
      <div class="fg"><label>Total Putts</label><input id="lputts" type="number" min="0" placeholder="e.g. 34" /></div>
      <div class="fg"><label>Avg Drive (yds)</label><input id="ldrv" type="number" min="0" placeholder="e.g. 245" /></div>
      <div class="fg"><label>Penalties</label><input id="lpen" type="number" min="0" placeholder="e.g. 2" /></div>
    </div>
    <div class="fg"><label>Notes (optional)</label><textarea id="lnotes" rows="3" style="resize:vertical" placeholder="Birdied 18 from the rough…"></textarea></div>
    <div class="err" id="log-err"></div>
    <button class="btnp" id="lbtn">Save Round</button>
  </div>`;
  const gi=id=>{const v=el.querySelector(id).value; return v!==''?parseInt(v):null;};
  el.querySelector('#lbtn').addEventListener('click', async()=>{
    const sc=parseInt(el.querySelector('#lsc').value);
    if(isNaN(sc)){el.querySelector('#log-err').textContent='Please enter a score.';return;}
    const btn=el.querySelector('#lbtn'); btn.disabled=true;
    try {
      const round={password:me._pw,date:el.querySelector('#ld').value||today,course:el.querySelector('#lc').value.trim()||null,score:sc,par:gi('#lpar')||72,fir:gi('#lfir'),firT:gi('#lfirt')||14,gir:gi('#lgir'),putts:gi('#lputts'),drive:gi('#ldrv'),pen:gi('#lpen'),notes:el.querySelector('#lnotes').value.trim()||null};
      await api('POST',`/api/players/${me.id}/rounds`,round);
      players=await api('GET','/api/players');
      const updated=players.find(p=>p.id===me.id);
      if(updated) me={...me,rounds:updated.rounds};
      notify('Round saved!'); go('lb');
    } catch(e){ el.querySelector('#log-err').textContent=e.message; btn.disabled=false; }
  });
}
async function rDet(el) {
  const player=players.find(p=>p.id===selId);
  if(!player){go('lb');return;}
  const rank=sorted().findIndex(p=>p.id===player.id)+1;
  const rounds=player.rounds||[]; const s=pstats(rounds);
  const sr=[...rounds].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const isMe=me&&player.id===me.id;
  const rrows=sr.map(r=>{
    const diff=r.par!=null?r.score-r.par:null;
    const rl=diff===null?'—':diff===0?'E':diff>0?`+${diff}`:String(diff);
    const rc=diff===null?'':diff<0?'su':diff>0?'so':'se';
    const firs=r.fir!=null?`${r.fir}/${r.firT||14}`:'—';
    return`<tr><td>${r.date||'—'}</td><td style="color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.course||'—')}</td><td style="font-weight:500;color:var(--cream)">${r.score}</td><td><span class="sp ${rc}">${rl}</span></td><td>${firs}</td><td>${r.gir!=null?r.gir+'/18':'—'}</td><td>${r.putts??'—'}</td><td>${r.drive?r.drive+'yd':'—'}</td><td>${r.pen??'—'}</td>${isMe?`<td><button class="db" data-rid="${r.id}">✕</button></td>`:'<td></td>'}</tr>`;
  }).join('');
  el.innerHTML=`
    <button class="bbk" id="bbk">← Leaderboard</button>
    <div class="phero">
      <div>
        <div class="phn">${esc(player.name)}${isMe?'<span class="pme" style="font-size:14px;vertical-align:middle;margin-left:10px">You</span>':''}</div>
        <div class="phhl">Handicap Index<span class="phhv">${player.hcp}</span></div>
        <div id="hea" style="margin-top:9px">${isMe?'<button class="btns" id="ehbtn">Update Handicap</button>':''}</div>
      </div>
      <div class="rbadge"><div class="rbl">Season Rank</div><div class="rbv">#${rank}</div></div>
    </div>
    <div class="slbl">Season Stats</div>
    <div class="sg">
      <div class="sc"><div class="scl">Rounds</div><div class="scv ac">${s.n}</div></div>
      <div class="sc"><div class="scl">Avg Score</div><div class="scv">${s.avs!=null?s.avs.toFixed(1):'—'}</div></div>
      <div class="sc"><div class="scl">Best Round</div><div class="scv">${s.best??'—'}</div></div>
      <div class="sc"><div class="scl">Avg Putts</div><div class="scv">${s.aputts!=null?s.aputts.toFixed(1):'—'}</div></div>
      <div class="sc"><div class="scl">Avg Drive</div><div class="scv">${s.adrive!=null?Math.round(s.adrive)+'yd':'—'}</div></div>
      <div class="sc"><div class="scl">Avg GIR</div><div class="scv">${s.agir!=null?s.agir.toFixed(1)+'/18':'—'}</div></div>
      <div class="sc"><div class="scl">FIR %</div><div class="scv">${s.afir!=null?Math.round(s.afir)+'%':'—'}</div></div>
    </div>
    ${sr.length?`<div class="slbl">Round History</div><div style="overflow-x:auto"><table class="rt"><thead><tr><th>Date</th><th>Course</th><th>Score</th><th>+/−</th><th>FIR</th><th>GIR</th><th>Putts</th><th>Drive</th><th>Pen.</th><th></th></tr></thead><tbody>${rrows}</tbody></table></div>`:`<div class="empty" style="padding:28px 0"><strong>No rounds logged yet.</strong>${isMe?'Head to "Log Round" to get started.':''}</div>`}
  `;
  el.querySelector('#bbk').addEventListener('click',()=>go('lb'));
  el.querySelector('#ehbtn')?.addEventListener('click',()=>{
    const area=el.querySelector('#hea');
    area.innerHTML=`<div class="he"><input id="hi" type="number" step="0.1" value="${player.hcp}" style="width:90px" /><button class="btns" id="hsv">Save</button><button class="btns" id="hcn">Cancel</button></div>`;
    area.querySelector('#hsv').addEventListener('click', async()=>{
      const v=parseFloat(area.querySelector('#hi').value); if(isNaN(v)) return;
      try { await api('PATCH',`/api/players/${me.id}`,{hcp:v,password:me._pw}); me.hcp=v; const idx=players.findIndex(p=>p.id===me.id); if(idx!==-1) players[idx].hcp=v; notify('Handicap updated!'); rDet(el); } catch(e){notify(e.message);}
    });
    area.querySelector('#hcn').addEventListener('click',()=>rDet(el));
  });
  el.querySelectorAll('.db').forEach(b=>b.addEventListener('click', async()=>{
    if(!confirm('Delete this round?')) return;
    try { await api('DELETE',`/api/players/${me.id}/rounds/${b.dataset.rid}`,{password:me._pw}); players=await api('GET','/api/players'); const updated=players.find(p=>p.id===me.id); if(updated) me={...me,rounds:updated.rounds}; notify('Round deleted.'); rDet(el); } catch(e){notify(e.message);}
  }));
}
async function init() {
  try {
    players=await api('GET','/api/players');
    const session=getSession();
    if(session){ try { const player=await api('POST','/api/login',{name:session.name,password:session.password}); player._pw=session.password; me=player; const myFull=players.find(p=>p.id===me.id); if(myFull) me={...me,rounds:myFull.rounds}; showApp(); return; } catch{clearSession();} }
    go('auth');
  } catch(e){ main().innerHTML=`<div class="ld">Could not connect to server.</div>`; }
}
init();
</script>
</body>
</html>
