<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fairway Club — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080e09;--s1:#0d1810;--s2:#122016;--s3:#1a2d1e;--gold:#c9a84c;--gold-l:#dfc06a;--gold-dim:rgba(201,168,76,.12);--cream:#ede2c8;--text:#d4cbb4;--muted:#6b8572;--dim:#3c5243;--border:rgba(201,168,76,.18);--border-s:rgba(201,168,76,.38);--red:#c95a3a;--green:#52a86e;--r:4px;--shadow:0 8px 32px rgba(0,0,0,.5);}
html,body{min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:'Lora',Georgia,serif;font-size:15px;line-height:1.6;background-image:radial-gradient(ellipse at 20% 0%,rgba(30,70,35,.22) 0%,transparent 55%),radial-gradient(ellipse at 80% 100%,rgba(15,45,20,.2) 0%,transparent 55%);}
.app{max-width:900px;margin:0 auto;padding:0 24px 80px}
.hdr{text-align:center;padding:52px 0 32px;border-bottom:1px solid var(--border);margin-bottom:40px;position:relative}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(32px,6vw,54px);font-weight:700;color:var(--cream);letter-spacing:.02em;line-height:1.1}
.title em{color:var(--gold);font-style:italic}
.subtitle{font-size:13px;color:var(--muted);margin-top:8px;font-style:italic;letter-spacing:.04em}
.user-bar{position:absolute;top:52px;right:0;display:flex;align-items:center;gap:10px}
.user-name{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.1em}
.btn-sm{background:transparent;border:.5px solid var(--border);border-radius:var(--r);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;cursor:pointer;transition:all .18s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.nav{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:40px}
.nbtn{flex:1;background:transparent;border:none;border-right:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:12px 8px;cursor:pointer;transition:all .18s}
.nbtn:last-child{border-right:none}
.nbtn:hover{background:var(--gold-dim);color:var(--gold-l)}
.nbtn.on{background:var(--gold-dim);color:var(--gold);font-weight:500}
.slbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:12px}
.slbl::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-wrap{max-width:400px;margin:40px auto 0}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:28px}
.atab{flex:1;background:transparent;border:none;border-right:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px;cursor:pointer;transition:all .18s}
.atab:last-child{border-right:none}
.atab.on{background:var(--gold-dim);color:var(--gold)}
.auth-title{font-family:'Playfair Display',serif;font-size:26px;color:var(--cream);margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:24px}
.fg{margin-bottom:16px}
.fg label{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);color:var(--cream);font-family:'Lora',serif;font-size:15px;padding:10px 14px;outline:none;transition:border-color .18s;-webkit-appearance:none;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg input::placeholder{color:var(--dim)}
.fg select option{background:#1a2d1e}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fsec{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin:24px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.btnp{width:100%;background:var(--gold);color:#080e09;border:none;border-radius:var(--r);padding:12px 24px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;cursor:pointer;margin-top:8px;transition:background .18s}
.btnp:hover{background:var(--gold-l)}
.btnp:disabled{opacity:.4;cursor:not-allowed}
.btns{background:transparent;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:6px 14px;cursor:pointer;transition:all .15s}
.btns:hover{border-color:var(--gold);color:var(--gold)}
.err{font-family:'DM Mono',monospace;font-size:12px;color:var(--red);margin-top:10px;min-height:18px}
.fw{max-width:560px;margin:0 auto}
.ft{font-family:'Playfair Display',serif;font-size:28px;color:var(--cream);margin-bottom:6px}
.fs{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:28px}
.lbt{width:100%;border-collapse:collapse}
.lbt th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:7px 12px;text-align:left;border-bottom:1px solid var(--border)}
.lbt th.r,.lbt td.r{text-align:right}
.lbrow{border-bottom:1px solid rgba(201,168,76,.07);cursor:pointer;transition:background .15s}
.lbrow:hover{background:var(--gold-dim)}
.lbrow td{padding:14px 12px;vertical-align:middle}
.rnk{font-family:'DM Mono',monospace;font-size:13px;color:var(--dim);width:34px}
.rnk.g1{color:var(--gold);font-weight:500}
.rnk.g2{color:#8a9e8a}
.rnk.g3{color:#9a7040}
.pname{font-family:'Playfair Display',serif;font-size:19px;color:var(--cream)}
.pme{font-size:10px;font-family:'DM Mono',monospace;color:var(--gold);margin-left:7px;letter-spacing:.1em;vertical-align:middle}
.psub{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.pbadges{font-size:14px;margin-top:3px;letter-spacing:2px}
.hv{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--gold);text-align:right}
.sv{font-family:'DM Mono',monospace;font-size:13px;color:var(--text);text-align:right}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-style:italic}
.empty strong{display:block;font-size:17px;color:var(--muted);font-weight:400;margin-bottom:6px}
.activity{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:28px}
.activity-item{font-size:13px;color:var(--text);padding:5px 0;border-bottom:1px solid rgba(201,168,76,.07);display:flex;align-items:center;gap:8px}
.activity-item:last-child{border-bottom:none;padding-bottom:0}
.activity-item:first-child{padding-top:0}
.activity-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);margin-left:auto;white-space:nowrap}
.bbk{background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:26px;transition:color .15s;display:flex;align-items:center;gap:6px}
.bbk:hover{color:var(--gold)}
.phero{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:34px;padding-bottom:22px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:14px}
.phn{font-family:'Playfair Display',serif;font-size:40px;font-weight:400;color:var(--cream);line-height:1;margin-bottom:8px}
.phhl{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.phhv{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--gold);margin-left:6px}
.rbadge-wrap{text-align:right}
.rbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-bottom:3px}
.rbv{font-family:'Playfair Display',serif;font-size:62px;color:var(--gold);line-height:1}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-bottom:34px}
.sc{background:var(--s2);border-radius:var(--r);padding:14px;text-align:center;border:1px solid var(--border)}
.scl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.scv{font-family:'DM Mono',monospace;font-size:21px;font-weight:500;color:var(--cream)}
.scv.ac{color:var(--gold)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin-bottom:34px}
.badge{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px 10px;text-align:center}
.badge.earned{border-color:var(--gold);background:var(--gold-dim)}
.badge.locked{opacity:.32}
.badge-emoji{font-size:26px;margin-bottom:6px}
.badge-name{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream);margin-bottom:3px}
.badge-desc{font-size:11px;color:var(--muted);font-style:italic;line-height:1.4}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:34px}
.chart-box{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.chart-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.chart-empty{font-size:13px;color:var(--dim);font-style:italic;text-align:center;padding:30px 0}
.rt{width:100%;border-collapse:collapse;font-size:12px}
.rt th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
.rt td{padding:9px 8px;border-bottom:1px solid rgba(201,168,76,.06);font-family:'DM Mono',monospace;color:var(--text);vertical-align:middle}
.rt tr:last-child td{border-bottom:none}
.sp{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500}
.su{background:rgba(82,168,110,.18);color:#52a86e}
.so{background:rgba(201,90,58,.15);color:#c95a3a}
.se{background:rgba(201,168,76,.15);color:var(--gold)}
.db{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 3px;transition:color .15s}
.db:hover{color:var(--red)}
.thumb{width:28px;height:28px;object-fit:cover;border-radius:2px;cursor:pointer;border:1px solid var(--border)}
.thumb:hover{border-color:var(--gold)}
.he{display:flex;align-items:center;gap:8px;margin-top:8px}
.he input{width:90px}
.bd-total{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin:4px 0 8px;transition:color .2s}
.bd-total.ok{color:var(--green)}
.photo-preview-img{max-width:180px;border-radius:var(--r);border:1px solid var(--border);margin-top:8px;display:block;cursor:pointer}
.cmp-header{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:10px;margin-bottom:24px}
.vs{font-family:'Playfair Display',serif;font-size:22px;color:var(--dim);text-align:center;font-style:italic}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.cmp-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.cmp-card.win{border-color:var(--gold);background:var(--gold-dim)}
.cmp-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.cmp-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--cream)}
.cmp-name{font-family:'Playfair Display',serif;font-size:22px;color:var(--cream);margin-bottom:4px;text-align:center}
.cmp-hcp{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold);text-align:center;margin-bottom:16px}
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--border-s);border-radius:var(--r);padding:10px 20px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--cream);box-shadow:var(--shadow);z-index:99;animation:fuUp .22s ease;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes fuUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ld{text-align:center;padding:70px;color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.1em}
#photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;display:none;align-items:center;justify-content:center;cursor:pointer}
#photo-modal img{max-width:95vw;max-height:95vh;border-radius:4px;object-fit:contain}
.pro-wrap{max-width:620px;margin:0 auto}
.pro-intro{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:28px}
.pro-intro-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--cream);margin-bottom:6px}
.pro-intro-sub{font-size:13px;color:var(--muted);font-style:italic;line-height:1.6}
.pro-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{background:transparent;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;padding:6px 14px;cursor:pointer;transition:all .18s;text-align:left}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.pro-chat{display:flex;flex-direction:column;gap:16px;margin-bottom:24px;min-height:0}
.pro-msg{padding:16px 18px;border-radius:var(--r);line-height:1.7;font-size:14px}
.pro-msg.user{background:var(--gold-dim);border:1px solid var(--border-s);color:var(--cream);font-style:italic}
.pro-msg.pro{background:var(--s2);border:1px solid var(--border);color:var(--text)}
.pro-msg.pro strong{color:var(--gold);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-style:normal}
.pro-msg ul{margin:8px 0 0 18px}
.pro-msg li{margin-bottom:4px}
.pro-thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;font-style:italic;padding:10px 0}
.pro-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin:0 2px;animation:dot-bounce .9s infinite}
.pro-dots span:nth-child(2){animation-delay:.15s}
.pro-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.pro-input-row{display:flex;gap:10px}
.pro-input-row input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);color:var(--cream);font-family:'Lora',serif;font-size:15px;padding:10px 14px;outline:none;transition:border-color .18s}
.pro-input-row input:focus{border-color:var(--gold)}
.pro-input-row input::placeholder{color:var(--dim)}
.pro-send{background:var(--gold);color:#080e09;border:none;border-radius:var(--r);padding:10px 18px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .18s}
.pro-send:hover{background:var(--gold-l)}
.pro-send:disabled{opacity:.4;cursor:not-allowed}
.pro-clear{background:none;border:none;color:var(--dim);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:8px 0 0;transition:color .15s}
.pro-clear:hover{color:var(--muted)}
/* COURSES */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:34px}
.course-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:border-color .18s,background .18s}
.course-card:hover{border-color:var(--gold);background:var(--gold-dim)}
.course-card-name{font-family:'Playfair Display',serif;font-size:18px;color:var(--cream);margin-bottom:6px;line-height:1.2}
.course-card-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.course-card-stats{display:flex;gap:16px;margin-top:10px}
.course-stat{text-align:center}
.course-stat-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--gold)}
.course-stat-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.stars{display:flex;gap:3px;align-items:center}
.star{font-size:16px;cursor:pointer;transition:transform .1s;line-height:1}
.star:hover{transform:scale(1.2)}
.stars-display{display:flex;gap:2px;align-items:center}
.stars-display .star{cursor:default;font-size:14px}
.star-avg{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold);margin-left:6px}
.course-detail-round{padding:10px 0;border-bottom:.5px solid rgba(201,168,76,.07);display:flex;align-items:flex-start;gap:12px}
.course-detail-round:last-child{border-bottom:none}
.cdr-score{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--gold);min-width:42px}
.cdr-info{flex:1}
.cdr-player{font-family:'Playfair Display',serif;font-size:15px;color:var(--cream)}
.cdr-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px}
.cdr-review{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}.phn{font-size:28px}.rbv{font-size:44px}.user-bar{position:static;justify-content:center;margin-top:14px}.chart-row{grid-template-columns:1fr}.cmp-header{grid-template-columns:1fr 40px 1fr}.cmp-grid{grid-template-columns:1fr}.pro-input-row{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="eyebrow">Summer 2026</div>
    <h1 class="title">The <em>Fairway</em> Club</h1>
    <p class="subtitle">Friends. Fairways. Bragging rights.</p>
    <div class="user-bar" id="user-bar" style="display:none">
      <button class="btn-sm" id="user-name-label" style="color:var(--gold);border-color:var(--border)"></button>
      <button class="btn-sm" id="logout-btn">Sign Out</button>
    </div>
  </header>
  <nav class="nav" id="nav" style="display:none">
    <button class="nbtn on" data-v="lb">Leaderboard</button>
    <button class="nbtn" data-v="log">Log Round</button>
    <button class="nbtn" data-v="cmp">Compare</button>
    <button class="nbtn" data-v="courses">Courses</button>
    <button class="nbtn" data-v="pro">Ask the Pro</button>
  </nav>
  <main id="main"><div class="ld">Loading the club…</div></main>
</div>
<div id="photo-modal"><img id="photo-modal-img" /></div>
<script>
const BADGES=[
  {id:'first_round',emoji:'🏌️',name:'Off the Tee',desc:'Logged your first round',check:p=>p.rounds.length>=1},
  {id:'five_rounds',emoji:'📅',name:'Five & Counting',desc:'Logged 5 rounds',check:p=>p.rounds.length>=5},
  {id:'ten_rounds',emoji:'🏆',name:'Dedicated',desc:'Logged 10 rounds',check:p=>p.rounds.length>=10},
  {id:'first_par',emoji:'⛳',name:'Par Hunter',desc:'Got at least one par in a round',check:p=>p.rounds.some(r=>(r.pars||0)>0)},
  {id:'first_birdie',emoji:'🐦',name:'Birdie!',desc:'Scored your first birdie ever',check:p=>p.rounds.some(r=>(r.birdies||0)>0)},
  {id:'eagle',emoji:'🦅',name:'Eagle Eye',desc:'Scored an eagle or better — legendary',check:p=>p.rounds.some(r=>(r.eagles||0)>0)},
  {id:'broke_100',emoji:'💯',name:'Sub-100',desc:'Shot 99 or better',check:p=>p.rounds.some(r=>r.score!=null&&r.score<=99)},
  {id:'broke_90',emoji:'🔥',name:'Sub-90',desc:'Shot 89 or better',check:p=>p.rounds.some(r=>r.score!=null&&r.score<=89)},
  {id:'broke_80',emoji:'👑',name:'Sub-80',desc:'Shot 79 or better — elite',check:p=>p.rounds.some(r=>r.score!=null&&r.score<=79)},
  {id:'triple_free',emoji:'🛡️',name:'Triple Free',desc:'Finished a round with zero triple bogeys',check:p=>p.rounds.some(r=>r.triples!=null&&r.triples===0)},

async function api(method,path,body){

let notifQueue=[],notifRunning=false;

function runQ(){if(!notifQueue.length){notifRunning=false;return;}notifRunning=true;document.querySelectorAll('.notif').forEach(n=>n.remove());const el=document.createElement('div');el.className='notif';el.textContent=notifQueue.shift();document.body.appendChild(el);setTimeout(()=>{el.remove();setTimeout(runQ,300);},3500);}

function checkActivity(){
  const lastVisit=localStorage.getItem('fc_last_visit')||new Date(0).toISOString();
  const nr=[];
  for(const p of players){if(me&&p.id===me.id)continue;for(const r of(p.rounds||[])){if(r.createdAt&&r.createdAt>lastVisit)nr.push({player:p,round:r});}}
  nr.sort((a,b)=>new Date(b.round.createdAt)-new Date(a.round.createdAt));
  nr.slice(0,3).forEach(({player,round})=>{notify(`🏌️ ${player.name} logged a ${round.score}${round.course?` at ${round.course}`:''}`)});
  localStorage.setItem('fc_last_visit',new Date().toISOString());
}

function timeAgo(iso){if(!iso)return'';const diff=Date.now()-new Date(iso).getTime();const m=Math.floor(diff/60000),h=Math.floor(diff/3600000),d=Math.floor(diff/86400000);if(d>0)return`${d}d ago`;if(h>0)return`${h}h ago`;if(m>0)return`${m}m ago`;return'just now';}

async function compressImage(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const maxW=1000,scale=Math.min(1,maxW/img.width);const canvas=document.createElement('canvas');canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.65));};img.src=e.target.result;};reader.readAsDataURL(file);});}

  const totalHoles=Object.values(totals).reduce((a,b)=>a+b,0);
  const rrows=sr.map(r=>{const diff=r.par!=null?r.score-r.par:null;const rl=diff===null?'—':diff===0?'E':diff>0?`+${diff}`:String(diff);const rc=diff===null?'':diff<0?'su':diff>0?'so':'se';const bdStr=(r.pars!=null||r.bogeys!=null)?`🦅${r.eagles||0} 🐦${r.birdies||0} ⛳${r.pars||0} +1:${r.bogeys||0} +2:${r.doubles||0} +3:${r.triples||0}`:'';return`<tr><td>${r.date||'—'}</td><td style="color:var(--muted);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.course||'—')}</td><td style="font-weight:500;color:var(--cream)">${r.score}</td><td><span class="sp ${rc}">${rl}</span></td><td style="font-size:10px;color:var(--muted)">${bdStr}</td><td>${r.putts??'—'}</td><td>${r.drive?r.drive+'yd':'—'}</td><td>${r.photo?`<img src="${r.photo}" class="thumb" />`:'—'}</td>${isMe?`<td><button class="db" data-rid="${r.id}">✕</button></td>`:'<td></td>'}</tr>`;}).join('');
  el.innerHTML=`<button class="bbk" id="bbk">← Leaderboard</button><div class="phero"><div><div class="phn">${esc(player.name)}${isMe?'<span class="pme" style="font-size:14px;vertical-align:middle;margin-left:10px">You</span>':''}</div><div class="phhl">Handicap Index<span class="phhv">${player.hcp}</span></div><div id="hea" style="margin-top:9px">${isMe?'<button class="btns" id="ehbtn">Update Handicap</button>':''}</div>${isMe?'<div style="margin-top:8px"><button class="btns" id="del-acct-btn" style="border-color:var(--red);color:var(--red)">Delete Account</button></div>':''}</div><div class="rbadge-wrap"><div class="rbl">Season Rank</div><div class="rbv">#${rank}</div></div></div><div class="slbl">Season Stats</div><div class="sg"><div class="sc"><div class="scl">Rounds</div><div class="scv ac">${s.n}</div></div><div class="sc"><div class="scl">Avg Score</div><div class="scv">${s.avs!=null?s.avs.toFixed(1):'—'}</div></div><div class="sc"><div class="scl">Best Round</div><div class="scv">${s.best??'—'}</div></div><div class="sc"><div class="scl">Avg Putts</div><div class="scv">${s.aputts!=null?s.aputts.toFixed(1):'—'}</div></div><div class="sc"><div class="scl">Avg Drive</div><div class="scv">${s.adrive!=null?Math.round(s.adrive)+'yd':'—'}</div></div><div class="sc"><div class="scl">Avg GIR</div><div class="scv">${s.agir!=null?s.agir.toFixed(1)+'/18':'—'}</div></div><div class="sc"><div class="scl">FIR %</div><div class="scv">${s.afir!=null?Math.round(s.afir)+'%':'—'}</div></div></div><div class="slbl">Achievements <span style="font-size:11px;font-family:'Lora',serif;font-style:italic;letter-spacing:0;text-transform:none;color:var(--muted)">${earned.length} / ${BADGES.length} earned</span></div><div class="badge-grid">${[...earned,...locked].map(b=>`<div class="badge ${earned.includes(b)?'earned':'locked'}"><div class="badge-emoji">${b.emoji}</div><div class="badge-name">${b.name}</div><div class="badge-desc">${b.desc}</div></div>`).join('')}</div>${rounds.length>=2?`<div class="slbl">Score History</div><div class="chart-row"><div class="chart-box"><div class="chart-title">Score Per Round</div><canvas id="score-chart" height="160"></canvas></div><div class="chart-box"><div class="chart-title">Scoring Breakdown</div>${hasBreakdown&&totalHoles>0?'<canvas id="breakdown-chart" height="160"></canvas>':'<div class="chart-empty">Log scoring breakdown<br>when entering rounds.</div>'}</div></div>`:''} ${sr.length?`<div class="slbl">Round History</div><div style="overflow-x:auto"><table class="rt"><thead><tr><th>Date</th><th>Course</th><th>Score</th><th>+/−</th><th>Breakdown</th><th>Putts</th><th>Drive</th><th>📸</th><th></th></tr></thead><tbody>${rrows}</tbody></table></div>`:`<div class="empty" style="padding:28px 0"><strong>No rounds logged yet.</strong>${isMe?'Head to "Log Round" to get started.':''}</div>`}`;
  el.querySelector('#bbk').addEventListener('click',()=>go('lb'));
  el.querySelector('#ehbtn')?.addEventListener('click',()=>{const area=el.querySelector('#hea');area.innerHTML=`<div class="he"><input id="hi" type="number" step="0.1" value="${player.hcp}" style="width:90px" /><button class="btns" id="hsv">Save</button><button class="btns" id="hcn">Cancel</button></div>`;area.querySelector('#hsv').addEventListener('click',async()=>{const v=parseFloat(area.querySelector('#hi').value);if(isNaN(v))return;try{await api('PATCH',`/api/players/${me.id}`,{hcp:v,password:me._pw});me.hcp=v;const idx=players.findIndex(p=>p.id===me.id);if(idx!==-1)players[idx].hcp=v;notify('Handicap updated!');rDet(el);}catch(e){notify(e.message);}});area.querySelector('#hcn').addEventListener('click',()=>rDet(el));});
  el.querySelector('#del-acct-btn')?.addEventListener('click',async()=>{
    if(!confirm('Delete your account? This will erase all your rounds and stats permanently.'))return;
    if(!confirm('Are you absolutely sure? This cannot be undone.'))return;
    try{await api('DELETE',`/api/players/${me.id}`,{password:me._pw});me=null;clearSession();players=await api('GET','/api/players');$('nav').style.display='none';$('user-bar').style.display='none';notify('Account deleted.');go('auth');}catch(e){notify(e.message);}
  });
  el.querySelectorAll('.db').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Delete this round?'))return;try{await api('DELETE',`/api/players/${me.id}/rounds/${b.dataset.rid}`,{password:me._pw});players=await api('GET','/api/players');const u=players.find(p=>p.id===me.id);if(u)me={...me,rounds:u.rounds};notify('Round deleted.');rDet(el);}catch(e){notify(e.message);}}));
  el.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click',()=>showPhoto(t.src)));
  if(rounds.length>=2){setTimeout(()=>{const sc=el.querySelector('#score-chart');if(sc){const bd=[...rounds].sort((a,b)=>new Date(a.date)-new Date(b.date));activeCharts.push(new Chart(sc,{type:'line',data:{labels:bd.map(r=>fmtDate(r.date)),datasets:[{data:bd.map(r=>r.score),borderColor:'#c9a84c',backgroundColor:'rgba(201,168,76,.1)',borderWidth:2,pointBackgroundColor:'#c9a84c',pointRadius:4,fill:true,tension:.3}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0d1810',borderColor:'rgba(201,168,76,.38)',borderWidth:1,titleColor:'#c9a84c',bodyColor:'#d4cbb4',callbacks:{label:ctx=>`Score: ${ctx.raw}`}}},scales:{x:{grid:{color:'rgba(201,168,76,.07)'},ticks:{color:'#6b8572',font:{family:'DM Mono',size:10}}},y:{grid:{color:'rgba(201,168,76,.07)'},ticks:{color:'#6b8572',font:{family:'DM Mono',size:10}}}}}}));}const bdc=el.querySelector('#breakdown-chart');if(bdc&&hasBreakdown&&totalHoles>0){activeCharts.push(new Chart(bdc,{type:'doughnut',data:{labels:['Eagles+','Birdies','Pars','Bogeys','Doubles','Triples+'],datasets:[{data:[totals.eagles,totals.birdies,totals.pars,totals.bogeys,totals.doubles,totals.triples],backgroundColor:['#2a8a4a','#52a86e','#c9a84c','#b8a060','#c95a3a','#8b2020'],borderWidth:0}]},options:{responsive:true,cutout:'58%',plugins:{legend:{position:'right',labels:{color:'#d4cbb4',font:{family:'DM Mono',size:10},padding:10,boxWidth:11}},tooltip:{backgroundColor:'#0d1810',borderColor:'rgba(201,168,76,.38)',borderWidth:1,titleColor:'#c9a84c',bodyColor:'#d4cbb4',callbacks:{label:ctx=>totalHoles>0?`${ctx.label}: ${ctx.raw} (${Math.round(ctx.raw/totalHoles*100)}%)`:ctx.label}}}}}));}},50);}
}

function rCmp(el){
  if(players.length<2){el.innerHTML=`<div class="empty"><strong>Need at least 2 players.</strong>Add more players to use Compare.</div>`;return;}
  if(!cmpIds[0])cmpIds[0]=players[0].id;
  if(!cmpIds[1]||cmpIds[1]===cmpIds[0])cmpIds[1]=players.find(p=>p.id!==cmpIds[0])?.id;
  const p1=players.find(p=>p.id===cmpIds[0]),p2=players.find(p=>p.id===cmpIds[1]);
  const s1=pstats(p1?.rounds||[]),s2=pstats(p2?.rounds||[]);
  const opts=sel=>players.map(pl=>`<option value="${pl.id}" ${pl.id===sel?'selected':''}>${esc(pl.name)}</option>`).join('');
  const statRow=(label,v1,v2,lowerBetter=true)=>{const win1=v1!=null&&v2!=null&&(lowerBetter?v1<v2:v1>v2);const win2=v1!=null&&v2!=null&&(lowerBetter?v2<v1:v2>v1);const fmt=v=>v!=null?(typeof v==='number'&&!Number.isInteger(v)?v.toFixed(1):v):'—';return`<div class="cmp-card ${win1?'win':''}"><div class="cmp-label">${label}</div><div class="cmp-val">${fmt(v1)}</div></div><div class="cmp-card ${win2?'win':''}"><div class="cmp-label">${label}</div><div class="cmp-val">${fmt(v2)}</div></div>`;};
  const e1=p1?earnedBadges(p1):[],e2=p2?earnedBadges(p2):[];
  el.innerHTML=`<div class="cmp-header"><div class="fg" style="margin:0"><select id="cmp-s1">${opts(cmpIds[0])}</select></div><div class="vs">vs</div><div class="fg" style="margin:0"><select id="cmp-s2">${opts(cmpIds[1])}</select></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;text-align:center"><div><div class="cmp-name">${esc(p1?.name||'—')}</div><div class="cmp-hcp">HCP ${p1?.hcp??'—'} · ${e1.length} badges</div></div><div><div class="cmp-name">${esc(p2?.name||'—')}</div><div class="cmp-hcp">HCP ${p2?.hcp??'—'} · ${e2.length} badges</div></div></div><div class="slbl">Head to Head</div><div class="cmp-grid">${statRow('Avg Score',s1.avs,s2.avs,true)}${statRow('Best Round',s1.best,s2.best,true)}${statRow('Rounds Played',s1.n,s2.n,false)}${statRow('Avg Putts',s1.aputts,s2.aputts,true)}${statRow('Avg Drive',s1.adrive!=null?Math.round(s1.adrive):null,s2.adrive!=null?Math.round(s2.adrive):null,false)}${statRow('Avg GIR',s1.agir,s2.agir,false)}${statRow('FIR %',s1.afir!=null?Math.round(s1.afir):null,s2.afir!=null?Math.round(s2.afir):null,false)}${statRow('Handicap',p1?.hcp,p2?.hcp,true)}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><div class="slbl">Badges — ${esc(p1?.name||'')}</div><div style="font-size:18px;letter-spacing:3px;line-height:2">${e1.map(b=>b.emoji).join(' ')||'<span style="font-size:13px;color:var(--muted);font-style:italic">None yet</span>'}</div></div><div><div class="slbl">Badges — ${esc(p2?.name||'')}</div><div style="font-size:18px;letter-spacing:3px;line-height:2">${e2.map(b=>b.emoji).join(' ')||'<span style="font-size:13px;color:var(--muted);font-style:italic">None yet</span>'}</div></div></div>`;
  el.querySelector('#cmp-s1').addEventListener('change',e=>{cmpIds[0]=e.target.value;if(cmpIds[0]===cmpIds[1])cmpIds[1]=players.find(p=>p.id!==cmpIds[0])?.id;rCmp(el);});
  el.querySelector('#cmp-s2').addEventListener('change',e=>{cmpIds[1]=e.target.value;if(cmpIds[1]===cmpIds[0])cmpIds[0]=players.find(p=>p.id!==cmpIds[1])?.id;rCmp(el);});
}

// COURSES
// ============================================================
function buildCourseMap() {
  const map = {}; // normalized name -> {name, rounds:[{player,round}]}
  for (const player of players) {
    for (const round of (player.rounds||[])) {
      if (!round.course) continue;
      const key = round.course.trim().toLowerCase();
      if (!map[key]) map[key] = { name: round.course.trim(), rounds: [] };
      map[key].rounds.push({ player, round });
    }
  }
  return Object.values(map).sort((a,b) => b.rounds.length - a.rounds.length);
}

function starsHtml(rating, size=14) {
  if (!rating) return '<span style="color:var(--dim);font-family:'DM Mono',monospace;font-size:11px">No ratings yet</span>';
  const full = Math.round(rating);
  return Array.from({length:5},(_,i)=>`<span style="font-size:${size}px;color:${i<full?'var(--gold)':'var(--dim)'}">${i<full?'★':'☆'}</span>`).join('');
}

function courseAvgRating(rounds) {
  const rated = rounds.filter(({round}) => round.courseRating);
  if (!rated.length) return null;
  return rated.reduce((s,{round}) => s + round.courseRating, 0) / rated.length;
}

function rCourses(el) {
  const courses = buildCourseMap();
  if (!courses.length) {
    el.innerHTML = `<div class="slbl">Course Log</div><div class="empty"><strong>No courses logged yet.</strong>Start logging rounds to build the course map.</div>`;
    return;
  }

  const cards = courses.map(c => {
    const avg = courseAvgRating(c.rounds);
    const scores = c.rounds.map(({round}) => round.score).filter(Boolean);
    const best = scores.length ? Math.min(...scores) : null;
    const players_set = [...new Set(c.rounds.map(({player}) => player.name))];
    return `<div class="course-card" data-key="${esc(c.name.toLowerCase())}">
      <div class="course-card-name">${esc(c.name)}</div>
      <div style="margin-bottom:8px">${starsHtml(avg)}${avg?`<span class="star-avg">${avg.toFixed(1)}</span>`:''}</div>
      <div class="course-card-stats">
        <div class="course-stat"><div class="course-stat-val">${c.rounds.length}</div><div class="course-stat-lbl">Rounds</div></div>
        ${best!=null?`<div class="course-stat"><div class="course-stat-val">${best}</div><div class="course-stat-lbl">Best</div></div>`:''}
        <div class="course-stat"><div class="course-stat-val">${players_set.length}</div><div class="course-stat-lbl">Player${players_set.length!==1?'s':''}</div></div>
      </div>
      <div class="course-card-meta" style="margin-top:10px;margin-bottom:0">${players_set.map(n=>esc(n)).join(' · ')}</div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="slbl">Course Log <span style="font-size:11px;font-family:'Lora',serif;font-style:italic;letter-spacing:0;text-transform:none;color:var(--muted)">${courses.length} course${courses.length!==1?'s':''} played this summer</span></div>
    <div class="course-grid">${cards}</div>`;

  el.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.key;
      const course = courses.find(c => c.name.toLowerCase() === key);
      if (course) showCourseDetail(el, course, courses);
    });
  });
}

function showCourseDetail(el, course, allCourses) {
  const avg = courseAvgRating(course.rounds);
  const sorted = [...course.rounds].sort((a,b) => a.round.score - b.round.score);
  const reviews = course.rounds.filter(({round}) => round.courseReview || round.courseRating);

  const roundRows = sorted.map(({player,round}) => {
    const diff = round.par != null ? round.score - round.par : null;
    const rl = diff===null?'':diff===0?' · E':diff>0?` · +${diff}`:` · ${diff}`;
    return `<div class="course-detail-round">
      <div class="cdr-score">${round.score}</div>
      <div class="cdr-info">
        <div class="cdr-player">${esc(player.name)}${rl?`<span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${rl}</span>`:''}</div>
        <div class="cdr-meta">${round.date||''}${round.courseRating?` · ${starsHtml(round.courseRating,12)}`:''}</div>
        ${round.courseReview?`<div class="cdr-review">"${esc(round.courseReview)}"</div>`:''}
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <button class="bbk" id="bbk">← All Courses</button>
    <div class="phero">
      <div>
        <div class="phn">${esc(course.name)}</div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
          ${starsHtml(avg, 22)}
          ${avg?`<span style="font-family:'DM Mono',monospace;font-size:18px;color:var(--gold);font-weight:500">${avg.toFixed(1)}</span><span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">(${reviews.length} rating${reviews.length!==1?'s':''})</span>`:''}
        </div>
      </div>
      <div class="rbadge-wrap">
        <div class="rbl">Rounds Here</div>
        <div class="rbv">${course.rounds.length}</div>
      </div>
    </div>
    <div class="slbl">All Rounds</div>
    <div>${roundRows}</div>
  `;

  el.querySelector('#bbk').addEventListener('click', () => rCourses(el));
}

// ============================================================
// ASK THE PRO
// ============================================================
const PRO_CHIPS = [
  "I keep topping the ball",
  "My drives always slice right",
  "I'm pulling every iron left",
  "I chunk my chips constantly",
  "Three-putting all day long",
  "I can't get out of bunkers",
  "I'm hitting it fat all the time",
  "How do I stop rushing my swing?",
  "My irons go way right (push)",
  "How should I play from the rough?",
  "Tips for playing in the wind",
  "How do I stop shanking the ball?",
];

let proHistory = []; // [{role, content}]

function rPro(el) {
  el.innerHTML = `<div class="pro-wrap">
    <div class="pro-intro">
      <div class="pro-intro-title">🏌️ Ask the Pro</div>
      <div class="pro-intro-sub">Got a problem with your game? Describe what's going wrong and get real coaching advice. No judgment — we're all out here trying.</div>
    </div>
    <div id="pro-chips" class="pro-chips">${PRO_CHIPS.map(c=>`<button class="chip" data-q="${esc(c)}">${c}</button>`).join('')}</div>
    <div id="pro-chat" class="pro-chat"></div>
    <div class="pro-input-row">
      <input id="pro-input" type="text" placeholder="Describe your problem… e.g. I keep slicing my driver" />
      <button class="pro-send" id="pro-send">Ask</button>
    </div>
    <button class="pro-clear" id="pro-clear">Clear conversation</button>
  </div>`;

  // Replay existing history
  renderProChat(el);

  el.querySelector('#pro-send').addEventListener('click', () => askPro(el));
  el.querySelector('#pro-input').addEventListener('keydown', e => { if (e.key === 'Enter') askPro(el); });
  el.querySelector('#pro-clear').addEventListener('click', () => { proHistory = []; renderProChat(el); });
  el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    el.querySelector('#pro-input').value = c.dataset.q;
    askPro(el);
  }));
}

function renderProChat(el) {
  const chat = el.querySelector('#pro-chat');
  if (!chat) return;
  if (!proHistory.length) { chat.innerHTML = ''; return; }
  chat.innerHTML = proHistory.map(m => {
    if (m.role === 'user') return `<div class="pro-msg user">"${esc(m.content)}"</div>`;
    return `<div class="pro-msg pro">${formatProResponse(m.content)}</div>`;
  }).join('');
  chat.scrollTop = chat.scrollHeight;
}

function formatProResponse(text) {
  // Convert markdown-ish to styled HTML
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^#{1,3}\s+(.+)$/gm, '<strong>$1</strong>')
    .replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>')
    .replace(/((<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

async function askPro(el) {
  const input = el.querySelector('#pro-input');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  proHistory.push({ role: 'user', content: q });
  renderProChat(el);

  // Show thinking indicator
  const chat = el.querySelector('#pro-chat');
  const thinking = document.createElement('div');
  thinking.className = 'pro-thinking';
  thinking.innerHTML = `<div class="pro-dots"><span></span><span></span><span></span></div><span>The pro is thinking…</span>`;
  chat.appendChild(thinking);
  chat.scrollTop = chat.scrollHeight;

  const btn = el.querySelector('#pro-send');
  btn.disabled = true;

  try {
    const messages = proHistory.map(m => ({ role: m.role, content: m.content }));
    const res = await fetch('/api/ask-pro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1024,
        system: `You are a friendly, encouraging golf coach helping a group of casual beginner-to-intermediate golfers (handicaps roughly 18-36) who are playing together for fun over the summer and want to improve. 

Your advice should be:
- Practical and immediately actionable on the course
- Explained simply — no overly technical jargon
- Encouraging and never condescending — these players are beginners and just want to have fun
- Focused on the most common cause of the problem first, then 1-2 quick fixes
- Concise — 3 to 5 short paragraphs max, use bullet points for drills or tips

When relevant, distinguish between a quick fix they can use mid-round vs. something to work on at the range. Always end on an encouraging note.`,
        messages,
      })
    });

    const data = await res.json();
    thinking.remove();

    if (!res.ok) throw new Error(data.error?.message || 'API error');

    const reply = data.content?.[0]?.text || 'Sorry, I couldn\'t get a response. Try again!';
    proHistory.push({ role: 'assistant', content: reply });
    renderProChat(el);
  } catch(e) {
    thinking.remove();
    proHistory.push({ role: 'assistant', content: `Sorry, something went wrong: ${e.message}. Check that your Anthropic API key is configured on the server.` });
    renderProChat(el);
  }

  btn.disabled = false;
  el.querySelector('#pro-input')?.focus();
}

async function init(){
  try{players=await api('GET','/api/players');const session=getSession();if(session){try{const player=await api('POST','/api/login',{name:session.name,password:session.password});player._pw=session.password;me=player;const myFull=players.find(p=>p.id===me.id);if(myFull)me={...me,rounds:myFull.rounds};checkActivity();showApp();return;}catch{clearSession();}}go('auth');}catch(e){main().innerHTML=`<div class="ld">Could not connect to server.</div>`;}
}
init();
</script>
